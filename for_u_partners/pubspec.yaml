name: for_u_partners
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: '>=3.0.3 <4.0.0'

# --- DEPENDENCIES (Pour votre application) ---
dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  cloud_firestore: ^6.0.0
  firebase_core: ^4.0.0 # Note : les versions de Firebase sont anciennes. Pensez à les mettre à jour ensemble.
  firebase_messaging: ^16.0.0
  firebase_crashlytics: ^5.0.0

  # State Management & Services
  stacked: ^3.4.0
  stacked_services: ^1.1.0

  # UI & Widgets
  loading_animation_widget: ^1.3.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.0
  google_fonts: ^6.2.1
  badges: ^3.1.1
  pull_to_refresh: ^2.0.0
  shimmer: ^3.0.0
  slider_button: ^2.1.0
  bounce: ^1.0.2 # Vérifiez si ce paquet est toujours nécessaire

  # Localisation & Cartes
  geocoding: ^4.0.0
  google_maps_flutter: ^2.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^10.1.0 # La dernière version est >14.0.0, une mise à jour est recommandée
  permission_handler: ^11.0.1 # La dernière version est >12.0.0
  location: ^8.0.1
  flutter_polyline_points: ^3.0.0
  font_awesome_flutter: ^10.10.0
  # Utilitaires & Réseau
  intl: ^0.20.2
  http: ^1.1.0
  image_picker: ^1.0.7
  file_picker: ^10.2.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^19.4.0
  path: ^1.8.3
  dio: ^5.3.2
  url_launcher: ^6.3.1
  logger: ^2.1.0
  flutter_dotenv: ^5.2.1 # La dernière version est >6.0.0
  change_app_package_name: ^1.5.0

# --- DEV DEPENDENCIES (Pour le développement et les tests  ) ---
dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: ^2.4.5
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  flutter_launcher_icons: ^0.13.1
  rename: ^3.0.1 # J'ai ajouté une version standard pour 'rename'

flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - .env

# --- CORRECTION DU CONFLIT DE DÉPENDANCE ---
# Force l'utilisation d'une version de 'vibration' compatible avec les APIs Flutter modernes,
# ignorant la contrainte stricte imposée par 'slider_button: ^2.1.0'.
dependency_overrides:
  vibration: ^3.1.4

